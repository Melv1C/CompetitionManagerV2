services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: competition_manager
      POSTGRES_USER: competition
      POSTGRES_PASSWORD: competition
    ports:
      - "5432:5432"
    volumes:
      - competition-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competition -d competition_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - competition-manager-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  competition-manager-postgres:
  competition-manager-redis:
