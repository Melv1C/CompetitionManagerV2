services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - competition-manager-v2-network

  test-redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - competition-manager-v2-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: competition-manager-v2-api
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@test-db:5432/postgres
      - REDIS_URL=redis://test-redis:6379
    networks:
      - competition-manager-v2-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: competition-manager-v2-worker
    depends_on:
      test-redis:
        condition: service_healthy
    environment:
      - APP_ENV=test
      - REDIS_URL=redis://test-redis:6379
    networks:
      - competition-manager-v2-network
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - APP_ENV=test
    container_name: competition-manager-v2-frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - competition-manager-v2-network
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - APP_ENV=test
    container_name: competition-manager-v2-admin
    depends_on:
      - api
    ports:
      - "5174:80"
    networks:
      - competition-manager-v2-network
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: apps/manager/Dockerfile
      args:
        - APP_ENV=test
    container_name: competition-manager-v2-manager
    depends_on:
      - api
    ports:
      - "5175:80"
    networks:
      - competition-manager-v2-network
    restart: unless-stopped

networks:
  competition-manager-v2-network:
    driver: bridge
