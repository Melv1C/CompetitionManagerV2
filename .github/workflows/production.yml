name: Production Deployment

on:
  push:
    tags:
      - "admin@*"
      - "api@*"
      - "frontend@*"
      - "manager@*"
      - "worker@*"
  workflow_dispatch:
    inputs:
      app:
        description: Application to build and deploy
        required: true
        type: choice
        options: [all, admin, api, frontend, manager, worker]
        default: all

jobs:
  detect-app:
    name: Detect App from Tag
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.parse.outputs.apps }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_APP: ${{ inputs.app }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$SELECTED_APP" == all ]]; then
              APPS='["admin","api","frontend","manager","worker"]'
            else
              APPS="$(jq -nc --arg app "$SELECTED_APP" '[$app]')"
            fi
          else
            APP="${REF_NAME%%@*}"
            VERSION="${REF_NAME#*@}"
            APPS="$(jq -nc --arg app "$APP" '[$app]')"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & Push Production Image
    needs: [detect-app]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-app.outputs.apps) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read package.json name
        id: read-name
        run: |
          APP_NAME=$(jq -r '.name' ./package.json)
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Build and push service production image
        if: matrix.app == 'api' || matrix.app == 'worker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.read-name.outputs.app_name }}-${{ matrix.app }}:latest
            ${{ needs.detect-app.outputs.version && format('{0}/{1}-{2}:{3}', secrets.DOCKERHUB_USERNAME, steps.read-name.outputs.app_name, matrix.app, needs.detect-app.outputs.version) || '' }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web production image
        if: matrix.app == 'admin' || matrix.app == 'frontend' || matrix.app == 'manager'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            APP_ENV=production
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.read-name.outputs.app_name }}-${{ matrix.app }}:latest
            ${{ needs.detect-app.outputs.version && format('{0}/{1}-{2}:{3}', secrets.DOCKERHUB_USERNAME, steps.read-name.outputs.app_name, matrix.app, needs.detect-app.outputs.version) || '' }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: [docker, detect-app]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy Production Deployment
        env:
          DOKPLOY_DOMAIN: ${{ secrets.DOKPLOY_DOMAIN }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$DOKPLOY_DOMAIN/api/compose.deploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg composeId "$COMPOSE_ID" '{composeId: $composeId}')"
