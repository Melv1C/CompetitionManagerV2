name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: competition_manager
          POSTGRES_USER: competition
          POSTGRES_PASSWORD: competition
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U competition -d competition_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run env:generate
      - run: bun run check
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
      - run: bun run db:generate
      - run: bun run e2e
