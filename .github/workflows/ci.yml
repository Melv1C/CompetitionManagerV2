name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athlete_import_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athlete_import_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate clean-checkout artifacts
        run: |
          bun run env:generate
          bun run prisma:generate

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.db.yml config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet

      - name: Validate Dokploy Compose URL mapping
        env:
          APP_ENV: staging
          DOCKERHUB_USERNAME: example
          IMAGE_TAG: staging
          DATABASE_URL: postgresql://example:example@postgres:5432/example
          REDIS_URL: redis://redis:6379
          BETTER_AUTH_SECRET: example-secret
          LOKI_HOST: http://loki:3100
          MY_APP_API_URL: https://api.example.com
          MY_APP_FRONTEND_URL: https://example.com
          MY_APP_MANAGER_URL: https://manager.example.com
          MY_APP_ADMIN_URL: https://admin.example.com
        run: |
          docker compose -f docker-compose.dokploy.yml config --format json | jq -e '
            .services.api.environment as $env |
            $env.API_URL == "https://api.example.com" and
            $env.FRONTEND_URL == "https://example.com" and
            $env.MANAGER_URL == "https://manager.example.com" and
            $env.ADMIN_URL == "https://admin.example.com"
          '

      - name: Prisma Validate
        run: bun run prisma:validate

      - name: Migrate integration database
        run: bun run prisma:migrate:deploy
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athlete_import_test

      - name: Varlock Validate (Development)
        run: bun run env:validate

      - name: Varlock Validate (Staging)
        run: bun run env:validate --filter=frontend --filter=admin
        env:
          APP_ENV: staging

      - name: Varlock Validate (Production)
        run: bun run env:validate --filter=frontend --filter=admin
        env:
          APP_ENV: production

      - name: Build all packages
        run: bun run build

      - name: Check (Format, Lint, Type Check)
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Run Redis and PostgreSQL integration tests
        run: bun run test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
          ATHLETE_IMPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athlete_import_test

      - name: Install Playwright browsers
        run: bun run --filter e2e e2e:install

      - name: Run e2e tests
        run: bun run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
