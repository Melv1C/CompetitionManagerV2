name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate clean-checkout artifacts
        run: |
          bun run env:generate
          bun run prisma:generate

      - name: Prisma Validate
        run: bun run prisma:validate

      - name: Varlock Validate (Development)
        run: bun run env:validate

      - name: Varlock Validate (Staging)
        run: bun run env:validate --filter=frontend --filter=admin
        env:
          APP_ENV: staging

      - name: Varlock Validate (Production)
        run: bun run env:validate --filter=frontend --filter=admin
        env:
          APP_ENV: production

      - name: Build all packages
        run: bun run build

      - name: Check (Format, Lint, Type Check)
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Run Redis integration tests
        run: bun run test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379/15

      - name: Install Playwright browsers
        run: bun run --filter e2e e2e:install

      - name: Run e2e tests
        run: bun run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
