name: Staging Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker:
    name: Build & Push ${{ matrix.app }} Staging Image
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, api, frontend, manager, worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read package.json name
        id: read-name
        run: |
          APP_NAME=$(jq -r '.name' ./package.json)
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.app }} staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            APP_ENV=staging
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.read-name.outputs.app_name }}-${{ matrix.app }}:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.read-name.outputs.app_name }}-${{ matrix.app }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Compose to Staging
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy Staging Deployment
        env:
          DOKPLOY_DOMAIN: ${{ secrets.DOKPLOY_DOMAIN }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$DOKPLOY_DOMAIN/api/compose.deploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg composeId "$COMPOSE_ID" '{composeId: $composeId}')"
